services:
  db:
    image: postgres:15
    container_name: aiis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aiis}
      POSTGRES_USER: ${POSTGRES_USER:-aiis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiis_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aiis_user} -d ${POSTGRES_DB:-aiis}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: aiis_backend
    restart: unless-stopped
    # daphne (ASGI) rather than gunicorn (WSGI) — needed so the WebSocket
    # signaling for apps.enterprise's live-camera viewer can share the same
    # port as normal HTTP/DRF traffic (see config/asgi.py). Single process:
    # the in-memory channel layer (see CHANNEL_LAYERS) only relays messages
    # within one process, and this is a low-throughput signaling channel,
    # not a bottleneck for the pilot scale this targets — revisit with
    # channels_redis + multiple daphne processes if that changes.
    # Runs through the image ENTRYPOINT (docker-entrypoint.sh), which applies
    # migrations first — so every `docker compose up --build` migrates.
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aiis}
      POSTGRES_USER: ${POSTGRES_USER:-aiis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiis_pass}
      REDIS_HOST: redis
      # job_sweeper (below) refreshes live jobs; requests only step in if it's down.
      JOB_SWEEPER_EXTERNAL: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Live-jobs sweep (~1,100 company boards every JOB_REFRESH_HOURS), kept out
  # of the daphne process so a sweep never slows down user requests.
  job_sweeper:
    build:
      context: ./backend
    container_name: aiis_job_sweeper
    restart: unless-stopped
    command: python manage.py sweep_jobs
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: wait
      COLLECTSTATIC: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aiis}
      POSTGRES_USER: ${POSTGRES_USER:-aiis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiis_pass}
    depends_on:
      db:
        condition: service_healthy

  scoring_worker:
    build:
      context: ./backend
    container_name: aiis_scoring_worker
    restart: unless-stopped
    command: python manage.py rqworker default --verbosity 1
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      # The backend container migrates on start; the worker just waits for it.
      RUN_MIGRATIONS: wait
      COLLECTSTATIC: "false"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-aiis}
      POSTGRES_USER: ${POSTGRES_USER:-aiis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiis_pass}
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: aiis_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  frontend:
    build:
      context: ./frontend
    container_name: aiis_frontend
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_PLATFORM_FREE: ${PLATFORM_FREE:-true}
      # Bind mounts from the Windows host into the container don't reliably
      # propagate native FS-change events, so webpack/Turbopack falls back
      # to slow/spurious rebuilds without polling-based watching.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

volumes:
  postgres_data:
